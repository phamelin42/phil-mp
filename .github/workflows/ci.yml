name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · format · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Historique complet : `<lastmod>` des sitemaps vient des commits.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Avant tout test : un test d'outil qui ouvre un navigateur passerait
      # partout sauf ici (leçon de Pattern Reader, PR #78).
      - name: Navigateur
        run: npx playwright install --with-deps chromium

      # Lint, format, tests de chaque projet, tests des outils et du schematic,
      # build de chaque application (contenu unique, pré-rendu, PWA, styles),
      # puis audit Playwright de chaque application.
      - run: npm run verify:ci
