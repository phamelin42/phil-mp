# Rapport mensuel de chaque produit en ligne (AGENTS.md, « Format du rapport
# mensuel »). Un produit est en ligne quand son produit.json a un
# `mesure.siteId`.
#
# Seules les étapes de lecture voient les secrets ; l'agent écrit le rapport à
# partir des deux JSON, sans réseau ni droit d'écriture. Le job `publier`,
# depuis un checkout propre de main, publie tous les rapports sur la branche
# `rapports` et ouvre une issue par produit : l'agent n'atteint jamais le code
# qui détient le jeton d'écriture.
name: Rapport mensuel

on:
  schedule:
    # Le 4 : la Search Console publie ses données avec deux à trois jours de retard.
    - cron: '0 5 4 * *'
  workflow_dispatch:
    inputs:
      mois:
        description: 'Mois couvert (AAAA-MM), défaut : le mois précédent'
        required: false

concurrency:
  group: rapport-mensuel
  cancel-in-progress: false

jobs:
  produits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      liste: ${{ steps.liste.outputs.liste }}
      mois: ${{ steps.mois.outputs.mois }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: liste
        run: |
          liste=$(node -e '
            const fs = require("fs");
            const slugs = fs.readdirSync("projects").filter((s) => {
              try { return JSON.parse(fs.readFileSync(`projects/${s}/produit.json`, "utf8")).mesure.siteId; }
              catch { return false; }
            });
            console.log(JSON.stringify(slugs));')
          echo "liste=$liste" >> "$GITHUB_OUTPUT"
          echo "Produits en ligne : $liste" >> "$GITHUB_STEP_SUMMARY"
      - id: mois
        env:
          MOIS: ${{ inputs.mois }}
        run: |
          mois="${MOIS:-$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)}"
          [[ "$mois" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || { echo "::error::Mois invalide : $mois"; exit 1; }
          echo "mois=$mois" >> "$GITHUB_OUTPUT"

  rapport:
    needs: produits
    if: needs.produits.outputs.liste != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slug: ${{ fromJson(needs.produits.outputs.liste) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rapport du mois précédent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MOIS: ${{ needs.produits.outputs.mois }}
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p .pilote "reports/$SLUG"
          avant=$(date -u -d "$MOIS-01 -1 day" +%Y-%m)
          if git fetch -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" rapports 2>/dev/null; then
            git show "FETCH_HEAD:reports/$SLUG/$avant.md" > .pilote/rapport-precedent.md 2>/dev/null ||
              rm -f .pilote/rapport-precedent.md
          fi

      - name: Lire Umami et la Search Console
        env:
          MOIS: ${{ needs.produits.outputs.mois }}
          SLUG: ${{ matrix.slug }}
          UMAMI_URL: ${{ secrets.UMAMI_URL }}
          UMAMI_TOKEN: ${{ secrets.UMAMI_TOKEN }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          export UMAMI_WEBSITE_ID=$(node -p "require('./projects/$SLUG/produit.json').mesure.siteId")
          export GSC_PROPRIETE=$(node -p "require('./projects/$SLUG/produit.json').mesure.proprieteSearchConsole")
          export GSC_DOMAINE=$(node -p "require('./projects/$SLUG/produit.json').domaine")
          node tools/umami.mjs mensuel "$MOIS" > .pilote/umami.json
          node tools/search-console.mjs mensuel "$MOIS" > .pilote/search-console.json
          node -e 'for (const f of ["umami","search-console"]) { const r = require(`./.pilote/${f}.json`); console.log(`${process.env.SLUG} · ${f} : ok ${r.ok} ${r.erreur ?? ""}`) }' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/rapport-mensuel ${{ matrix.slug }} ${{ needs.produits.outputs.mois }}'
          claude_args: >-
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Write"

      - name: Empaqueter
        if: always()
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          a="$RUNNER_TEMP/artefact/$SLUG"
          mkdir -p "$a"
          cp reports/"$SLUG"/*.md "$a/" 2>/dev/null || true
          cp .pilote/issue-titre.txt "$a/" 2>/dev/null || true

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-${{ matrix.slug }}
          path: ${{ runner.temp }}/artefact
          retention-days: 30

  publier:
    needs: [produits, rapport]
    if: always() && needs.produits.outputs.liste != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rapport-*
          merge-multiple: true
          path: ${{ runner.temp }}/artefact

      # L'artefact n'est lu que comme une donnée : pour chaque produit attendu,
      # un seul fichier au nom validé, de taille bornée. Rien de l'agent ne
      # s'exécute ici.
      - name: Publier les rapports et ouvrir les issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MOIS: ${{ needs.produits.outputs.mois }}
          LISTE: ${{ needs.produits.outputs.liste }}
        run: |
          set -euo pipefail
          [[ "$MOIS" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || exit 1
          d="$RUNNER_TEMP/rapports"
          distant="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if ! git clone -q --depth 1 --branch rapports "$distant" "$d" 2>/dev/null; then
            git init -q "$d" && git -C "$d" checkout -q --orphan rapports
          fi
          publies=()
          for slug in $(echo "$LISTE" | jq -r '.[]'); do
            [[ "$slug" =~ ^[a-z][a-z0-9-]*$ ]] || continue
            r="$RUNNER_TEMP/artefact/$slug/$MOIS.md"
            if [ ! -f "$r" ] || [ -L "$r" ] || [ "$(stat -c %s "$r")" -gt 100000 ]; then
              echo "::warning::$slug : aucun rapport valide pour $MOIS."
              continue
            fi
            mkdir -p "$d/reports/$slug" && cp "$r" "$d/reports/$slug/$MOIS.md"
            publies+=("$slug")
          done
          [ ${#publies[@]} -gt 0 ] || exit 0
          git -C "$d" add reports
          git -C "$d" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Rapports mensuels $MOIS" || true
          git -C "$d" push -q "$distant" HEAD:rapports
          for slug in "${publies[@]}"; do
            r="$RUNNER_TEMP/artefact/$slug/$MOIS.md"
            cat "$r" >> "$GITHUB_STEP_SUMMARY"
            titre="Rapport mensuel $slug $MOIS"
            t="$RUNNER_TEMP/artefact/$slug/issue-titre.txt"
            [ -s "$t" ] && titre=$(head -n 1 "$t" | cut -c1-200)
            gh issue create --repo "$REPO" --title "$titre" --body-file "$r" --label rapport ||
              gh issue create --repo "$REPO" --title "$titre" --body-file "$r"
          done
